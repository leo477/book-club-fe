name: i18n Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  i18n-check:
    name: Check i18n Keys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Check en/uk key parity
        run: |
          node -e "
          const fs = require('fs');
          const read = (l) => Object.keys(JSON.parse(fs.readFileSync('packages/i18n/locales/' + l + '.json', 'utf8')));
          const uk = read('uk');
          const en = read('en');
          const missingInEn = uk.filter((k) => !en.includes(k));
          const missingInUk = en.filter((k) => !uk.includes(k));
          missingInEn.forEach((k) => console.error('Missing in en.json: ' + k));
          missingInUk.forEach((k) => console.error('Missing in uk.json: ' + k));
          if (missingInEn.length || missingInUk.length) process.exit(1);
          console.log('All ' + uk.length + ' keys present in both locales.');
          "
