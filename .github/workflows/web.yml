# Next.js front door (apps/web) + shared packages. Deploys the `book-club-web` Vercel project.
# The Angular app is built and deployed by ci.yml (project `book-club-fe`).

name: Web

on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package-lock.json'
      - 'src/app/app.routes.ts'
      - 'src/app/**/*.routes.ts'
      - 'scripts/check-route-coverage.mjs'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package-lock.json'
      - 'src/app/app.routes.ts'
      - 'src/app/**/*.routes.ts'
      - 'scripts/check-route-coverage.mjs'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (apps/web + packages/*)
        run: npm run lint --workspaces --if-present

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Other workspaces import the generated ICU messages.
      - name: Build i18n package
        run: npm run build -w @book-club/i18n
      - name: Type check (apps/web + packages/*)
        run: npm run typecheck --workspaces --if-present

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests (Vitest, apps/web + packages/*)
        run: npm run test --workspaces --if-present

  route-coverage:
    name: Route Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Every Angular route must be in the strangler manifest and the wildcard backed by app/not-found.tsx.
      - name: Compare Angular routes with the strangler manifest
        run: node scripts/check-route-coverage.mjs

  build:
    name: Next Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # next.config.ts refuses to build for production without it; the value is not deployed from here.
      LEGACY_ORIGIN: https://book-club-fe-dmytros-projects-ad22eb22.vercel.app
      # the production build refuses to run without it (inlined into the client bundle; public, not a secret)
      NEXT_PUBLIC_OAUTH_BASE_URL: https://book-club-be.onrender.com/api/v1
      # chat socket base, inlined at build time and required by the production build; must stay inside the CSP connect-src
      NEXT_PUBLIC_WS_URL: wss://book-club-be.onrender.com/api/v1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-next-
      - name: Install dependencies
        run: npm ci
      - name: Build (apps/web)
        run: npm run build -w @book-club/web
      - name: Promotion guard is absent from a normal build
        run: node apps/web/scripts/check-legacy-guard.mjs absent apps/web/.next/server
      # The guard only exists in the artifact when the flag is on (dead-code-eliminated otherwise), so build once more as a preview with it.
      - name: Rebuild as a flagged preview (DISABLE_LEGACY_FALLBACK)
        run: npm run build -w @book-club/web
        env:
          DISABLE_LEGACY_FALLBACK: '1'
          VERCEL_ENV: preview
      - name: Promotion guard is baked into the flagged build
        run: node apps/web/scripts/check-legacy-guard.mjs present apps/web/.next/server

  deploy:
    name: Deploy to Vercel (book-club-web)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, route-coverage, build]
    # Only lint/typecheck/test/route-coverage/build gate the release; production is deployed from main only.
    if: github.event_name == 'push'
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
      # `vercel build` runs the production build here, which refuses to run without it (public value, not a secret)
      NEXT_PUBLIC_OAUTH_BASE_URL: https://book-club-be.onrender.com/api/v1
      # chat socket base, inlined at build time and required by the production build; must stay inside the CSP connect-src
      NEXT_PUBLIC_WS_URL: wss://book-club-be.onrender.com/api/v1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install Vercel CLI
        run: npm install --global vercel@55.0.0
      # Run from the repo root: the project's rootDirectory (apps/web) and
      # "include source files outside root directory" make Vercel resolve the npm workspaces.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build project via Vercel
        run: vercel build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $DEPLOY_URL"
