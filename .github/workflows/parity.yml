# Hermetic parity e2e: the Next app (production build, legacy fallback off) driven by the Playwright `next` project.
# Every /api/v1 call is either fulfilled by page.route mocks in the specs or answered by the local mock backend; nothing talks to production.
# A hermetic mock backend (https://localhost:9922, throwaway cert) and an Edge Config stub (http://localhost:9944) back the Next server, so r5, r6-club-detail, r11 and r12 run here (next project).
# The Angular app is built with the production configuration and served by e2e/parity/legacy-server.mjs (vercel.json rewrites and headers, /api proxied to the mock backend), so the legacy project
# runs r6-club-detail, r11 and r12 here too, r6-dual compares both targets, and r6-visual records its baselines from the legacy server in this job and compares Next to them.
# Jobs run in parallel: next (spec groups), legacy (only when the diff can change legacy behaviour), compare (needs both builds); the last job keeps the required check name.
# Not run here (need a deployed app or a real backend): r6-real-backend, the /clubs visual baselines (recorded with an unreachable backend) and the HAR diff.

name: Parity

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'src/**'
      - 'public/**'
      - 'angular.json'
      - 'vercel.json'
      - 'e2e/parity/**'
      - 'playwright.parity.config.ts'
      - 'package-lock.json'
      - '.github/workflows/parity.yml'
      - '.github/actions/parity-setup/**'

permissions:
  contents: read

env:
  # the production build refuses to run without these (public values, not secrets)
  LEGACY_ORIGIN: https://legacy.invalid
  NEXT_PUBLIC_OAUTH_BASE_URL: https://book-club-be.onrender.com/api/v1
  NEXT_PUBLIC_WS_URL: wss://book-club-be.onrender.com/api/v1
  # local mock backend (e2e/parity/r6/mock-backend.ts, self-signed cert): nothing can reach the production backend
  BACKEND_ORIGIN: https://localhost:9922
  REVALIDATE_SECRET: parity-secret
  EDGE_CONFIG: http://localhost:9944/ecfg_parity?token=t
  # preview-only flag: every manifest route renders on Next and nothing is proxied to the legacy app
  VERCEL_ENV: preview
  DISABLE_LEGACY_FALLBACK: '1'
  PARITY_NEXT_URL: http://localhost:3000
  # the production Angular build, served locally; its response CSP blocks Playwright's injected scripts, so the legacy contexts bypass it
  PARITY_LEGACY_URL: http://localhost:4200
  PARITY_LEGACY_BYPASS_CSP: '1'
  LEGACY_API_ORIGIN: https://localhost:9922

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect legacy-affecting changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      legacy: ${{ steps.diff.outputs.legacy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Diff against the PR base
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only --no-renames "$BASE_SHA" HEAD | grep -qE '^(src/|public/|packages/|e2e/parity/|angular\.json$|vercel\.json$|playwright\.parity\.config\.ts$|package-lock\.json$|package\.json$|tsconfig[^/]*\.json$|postcss\.config\.json$|proxy\.conf\.json$|\.github/workflows/parity\.yml$|\.github/actions/parity-setup/)'; then
            echo "legacy=true" >> "$GITHUB_OUTPUT"
          else
            echo "legacy=false" >> "$GITHUB_OUTPUT"
          fi

  next:
    name: Parity next (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: seo-visual-journeys
            run: |
              npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/seo.spec.ts
              npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/visual.spec.ts -g "privacy|terms"
              npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/visual.spec.ts -g "login|register"
              npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/r7-events.spec.ts e2e/parity/r8-profile-support.spec.ts e2e/parity/r9-auth.spec.ts
          - name: quizzes-clubs
            run: |
              npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/r11-quizzes.spec.ts
              npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/r5-clubs.spec.ts
          - name: club-detail-chat
            run: |
              npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/r6-club-detail.spec.ts
              npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/r12-chat.spec.ts
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Parity setup
        uses: ./.github/actions/parity-setup
      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-next-
      - name: Build (apps/web)
        run: npm run build -w @book-club/web
      - name: Start Next
        run: |
          nohup npm run start -w @book-club/web -- -p 3000 > next-server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/login && exit 0
            sleep 1
          done
          cat next-server.log
          exit 1
      - name: Specs (next)
        run: ${{ matrix.run }}
      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-report-next-${{ matrix.name }}
          path: |
            playwright-report/parity
            test-results
            next-server.log
            mock-backend.log
            edge-config.log
          retention-days: 7
          if-no-files-found: ignore

  legacy:
    name: Parity legacy (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.legacy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: quizzes
            run: npx playwright test --config=playwright.parity.config.ts --project=legacy e2e/parity/r11-quizzes.spec.ts
          - name: club-detail-chat
            run: |
              npx playwright test --config=playwright.parity.config.ts --project=legacy e2e/parity/r6-club-detail.spec.ts
              npx playwright test --config=playwright.parity.config.ts --project=legacy e2e/parity/r12-chat.spec.ts
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Parity setup
        uses: ./.github/actions/parity-setup
      - name: Build Angular app (production configuration)
        run: npm run build -- --configuration=production
      - name: Start legacy server
        run: |
          nohup env PORT=4200 node e2e/parity/legacy-server.mjs > legacy-server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:4200/login && asset=$(curl -fsS http://localhost:4200/ | grep -oE 'main-[A-Za-z0-9_-]+\.js' | head -1) && [ -n "$asset" ] && curl -fsS -o /dev/null "http://localhost:4200/$asset" && exit 0
            sleep 1
          done
          cat legacy-server.log
          exit 1
      - name: Specs (legacy)
        run: ${{ matrix.run }}
      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-report-legacy-${{ matrix.name }}
          path: |
            playwright-report/parity
            test-results
            legacy-server.log
            mock-backend.log
            edge-config.log
          retention-days: 7
          if-no-files-found: ignore

  compare:
    name: Parity compare (legacy vs next)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Parity setup
        uses: ./.github/actions/parity-setup
      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-next-
      - name: Build (apps/web)
        run: npm run build -w @book-club/web
      - name: Start Next
        run: |
          nohup npm run start -w @book-club/web -- -p 3000 > next-server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/login && exit 0
            sleep 1
          done
          cat next-server.log
          exit 1
      - name: Build Angular app (production configuration)
        run: npm run build -- --configuration=production
      - name: Start legacy server
        run: |
          nohup env PORT=4200 node e2e/parity/legacy-server.mjs > legacy-server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:4200/login && asset=$(curl -fsS http://localhost:4200/ | grep -oE 'main-[A-Za-z0-9_-]+\.js' | head -1) && [ -n "$asset" ] && curl -fsS -o /dev/null "http://localhost:4200/$asset" && exit 0
            sleep 1
          done
          cat legacy-server.log
          exit 1
      - name: Club detail request diff and rendered head (legacy vs next)
        run: npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/r6-dual.spec.ts
      - name: Club detail visual (record legacy baselines, compare next)
        run: |
          npx playwright test --config=playwright.parity.config.ts --project=legacy e2e/parity/r6-visual.spec.ts --update-snapshots=all
          npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/r6-visual.spec.ts
      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-report-compare
          path: |
            playwright-report/parity
            test-results
            e2e/parity/__snapshots__
            next-server.log
            mock-backend.log
            edge-config.log
            legacy-server.log
          retention-days: 7
          if-no-files-found: ignore

  parity:
    name: Parity e2e (next and legacy)
    needs: [changes, next, legacy, compare]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every parity job to pass (only the legacy job may be skipped)
        env:
          CHANGES: ${{ needs.changes.result }}
          NEXT: ${{ needs.next.result }}
          LEGACY: ${{ needs.legacy.result }}
          COMPARE: ${{ needs.compare.result }}
        run: |
          echo "changes=$CHANGES next=$NEXT legacy=$LEGACY compare=$COMPARE"
          [ "$CHANGES" = success ] && [ "$NEXT" = success ] && [ "$COMPARE" = success ] || exit 1
          [ "$LEGACY" = success ] || [ "$LEGACY" = skipped ] || exit 1
