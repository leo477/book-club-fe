# Hermetic parity e2e: the Next app (production build, legacy fallback off) driven by the Playwright `next` project.
# Every /api/v1 call is either fulfilled by page.route mocks in the specs or answered by the local mock backend; nothing talks to production.
# A hermetic mock backend (https://localhost:9922, throwaway cert) and an Edge Config stub (http://localhost:9944) back the Next server, so r5, r6-club-detail, r11 and r12 run here (next project).
# The Angular app is built with the production configuration and served by e2e/parity/legacy-server.mjs (vercel.json rewrites and headers, /api proxied to the mock backend), so the legacy project
# runs r6-club-detail, r11 and r12 here too, r6-dual compares both targets, and r6-visual records its baselines from the legacy server in this job and compares Next to them.
# Not run here (need a deployed app or a real backend): r6-real-backend, the /clubs visual baselines (recorded with an unreachable backend) and the HAR diff.

name: Parity

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'src/**'
      - 'public/**'
      - 'angular.json'
      - 'vercel.json'
      - 'e2e/parity/**'
      - 'playwright.parity.config.ts'
      - 'package-lock.json'
      - '.github/workflows/parity.yml'

permissions:
  contents: read

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Parity e2e (next and legacy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # the production build refuses to run without these (public values, not secrets)
      LEGACY_ORIGIN: https://legacy.invalid
      NEXT_PUBLIC_OAUTH_BASE_URL: https://book-club-be.onrender.com/api/v1
      NEXT_PUBLIC_WS_URL: wss://book-club-be.onrender.com/api/v1
      # local mock backend (e2e/parity/r6/mock-backend.ts, self-signed cert): nothing can reach the production backend
      BACKEND_ORIGIN: https://localhost:9922
      REVALIDATE_SECRET: parity-secret
      EDGE_CONFIG: http://localhost:9944/ecfg_parity?token=t
      # preview-only flag: every manifest route renders on Next and nothing is proxied to the legacy app
      VERCEL_ENV: preview
      DISABLE_LEGACY_FALLBACK: '1'
      PARITY_NEXT_URL: http://localhost:3000
      # the production Angular build, served locally; its response CSP blocks Playwright's injected scripts, so the legacy contexts bypass it
      PARITY_LEGACY_URL: http://localhost:4200
      PARITY_LEGACY_BYPASS_CSP: '1'
      LEGACY_API_ORIGIN: https://localhost:9922
    steps:
      - name: Set mock backend cert path
        # the runner context is not available in job-level env, so export it for the later steps here
        run: echo "MOCK_BACKEND_CERT=$RUNNER_TEMP/mock-backend-cert.pem" >> "$GITHUB_ENV"
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-next-
      - name: Start mock backend and Edge Config stub
        run: |
          nohup node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON e2e/parity/r6/mock-backend.ts 9922 > mock-backend.log 2>&1 &
          nohup env PORT=9944 node e2e/parity/r12/edge-config-server.mjs > edge-config.log 2>&1 &
          for _ in $(seq 1 30); do
            [ -s "$MOCK_BACKEND_CERT" ] && curl -fsS -o /dev/null --cacert "$MOCK_BACKEND_CERT" https://localhost:9922/__requests && curl -fsS -o /dev/null http://localhost:9944/ecfg_parity/items && exit 0
            sleep 1
          done
          cat mock-backend.log edge-config.log
          exit 1
      - name: Build (apps/web)
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/mock-backend-cert.pem
        run: npm run build -w @book-club/web
      - name: Start Next
        env:
          # the /api rewrite proxy verifies the mock backend's throwaway certificate
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/mock-backend-cert.pem
        run: |
          nohup npm run start -w @book-club/web -- -p 3000 > next-server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/login && exit 0
            sleep 1
          done
          cat next-server.log
          exit 1
      - name: SEO (raw HTML and rendered)
        run: npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/seo.spec.ts
      - name: Visual (privacy, terms)
        run: npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/visual.spec.ts -g "privacy|terms"
      - name: Visual (login, register)
        run: npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/visual.spec.ts -g "login|register"
      - name: Mocked journeys (events, profile/support, auth)
        run: npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/r7-events.spec.ts e2e/parity/r8-profile-support.spec.ts e2e/parity/r9-auth.spec.ts
      - name: Clubs list (r5)
        run: npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/r5-clubs.spec.ts
      - name: Club detail (r6)
        run: npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/r6-club-detail.spec.ts
      - name: Quizzes (r11)
        run: npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/r11-quizzes.spec.ts
      - name: Chat (r12)
        run: npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/r12-chat.spec.ts
      - name: Build Angular app (production configuration)
        run: npm run build -- --configuration=production
      - name: Start legacy server
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/mock-backend-cert.pem
        run: |
          nohup env PORT=4200 node e2e/parity/legacy-server.mjs > legacy-server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:4200/login && exit 0
            sleep 1
          done
          cat legacy-server.log
          exit 1
      - name: Club detail and quizzes (legacy)
        run: npx playwright test --config=playwright.parity.config.ts --project=legacy e2e/parity/r6-club-detail.spec.ts e2e/parity/r11-quizzes.spec.ts
      - name: Chat (legacy)
        run: npx playwright test --config=playwright.parity.config.ts --project=legacy e2e/parity/r12-chat.spec.ts
      - name: Club detail request diff and rendered head (legacy vs next)
        run: npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/r6-dual.spec.ts
      - name: Club detail visual (record legacy baselines, compare next)
        run: |
          npx playwright test --config=playwright.parity.config.ts --project=legacy e2e/parity/r6-visual.spec.ts --update-snapshots=all
          npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/r6-visual.spec.ts
      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-report
          path: |
            playwright-report/parity
            test-results
            next-server.log
            mock-backend.log
            edge-config.log
            legacy-server.log
          retention-days: 7
          if-no-files-found: ignore
