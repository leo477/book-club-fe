# Hermetic parity e2e: the Next app (production build, legacy fallback off) driven by the Playwright `next` project.
# Every /api/v1 call is either fulfilled by page.route mocks in the specs or hits an unreachable backend; nothing talks to production.
# Not run here (need a deployed legacy app, a real backend, a mock backend or an Edge Config stub): r5, r6*, r11, r12, and the legacy project.

name: Parity

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'e2e/parity/**'
      - 'playwright.parity.config.ts'
      - 'package-lock.json'
      - '.github/workflows/parity.yml'

permissions:
  contents: read

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Parity e2e (next)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # the production build refuses to run without these (public values, not secrets)
      LEGACY_ORIGIN: https://legacy.invalid
      NEXT_PUBLIC_OAUTH_BASE_URL: https://book-club-be.onrender.com/api/v1
      NEXT_PUBLIC_WS_URL: wss://book-club-be.onrender.com/api/v1
      # deliberately unreachable: the browser never gets real data, so nothing can reach the production backend
      BACKEND_ORIGIN: https://127.0.0.1:9
      # preview-only flag: every manifest route renders on Next and nothing is proxied to the legacy app
      VERCEL_ENV: preview
      DISABLE_LEGACY_FALLBACK: '1'
      PARITY_NEXT_URL: http://localhost:3000
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-next-
      - name: Build (apps/web)
        run: npm run build -w @book-club/web
      - name: Start Next
        run: |
          nohup npm run start -w @book-club/web -- -p 3000 > next-server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/login && exit 0
            sleep 1
          done
          cat next-server.log
          exit 1
      - name: SEO (raw HTML and rendered)
        run: npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/seo.spec.ts
      - name: Visual (privacy, terms)
        run: npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/visual.spec.ts -g "privacy|terms"
      - name: Visual (login, register)
        run: npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/visual.spec.ts -g "login|register"
      - name: Mocked journeys (events, profile/support, auth)
        run: npx playwright test --config=playwright.parity.config.ts --project=next e2e/parity/r7-events.spec.ts e2e/parity/r8-profile-support.spec.ts e2e/parity/r9-auth.spec.ts
      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-report
          path: |
            playwright-report/parity
            test-results
            next-server.log
          retention-days: 7
          if-no-files-found: ignore
