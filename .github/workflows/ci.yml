# Angular 20 CI Workflow
# Triggers on push to develop and pull requests targeting develop or main

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Cache npm and Angular cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            .angular/cache
          key: ${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Cache npm and Angular cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            .angular/cache
          key: ${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-
      - name: Install dependencies
        run: npm ci
      - name: Run tests (Vitest)
        run: npm run test:ci -- --coverage
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Cache npm and Angular cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            .angular/cache
          key: ${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-
      - name: Install dependencies
        run: npm ci
      - name: Build (production)
        run: npm run build -- --configuration=production

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Cache npm and Angular cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            .angular/cache
          key: ${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-
      - name: Install dependencies
        run: npm ci
      # Production deps only: the remaining high advisory (braces, no patched release yet)
      # is reachable solely via dev tooling (eslint-config-next, @spartan-ng/cli). SCRUM-78.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Cache npm and Angular cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            .angular/cache
          key: ${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.spec.json

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [test]
    # Skip SonarCloud for Dependabot PRs — GitHub withholds secrets from dependabot[bot]
    # by default on `pull_request` events, causing SONAR_TOKEN to be empty (exit code 3).
    # Analysis will still run on the merge commit once merged to develop/main.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0  # Shallow clones disabled for better relevance
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Cache npm and Angular cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            .angular/cache
          key: ${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-
      - name: Download coverage artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage
      # NOTE: Automatic Analysis must be disabled in SonarCloud project settings
      # (Administration → Analysis Method) to avoid exit-code-3 conflict with CI scanning.
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Wait for SonarCloud analysis to complete
        if: github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          TASK_ID=$(grep ceTaskId .scannerwork/report-task.txt | cut -d= -f2)
          echo "Waiting for SonarCloud task: $TASK_ID"
          for i in $(seq 1 60); do
            curl -s -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarcloud.io/api/ce/task?id=$TASK_ID" -o task-status.json
            STATUS=$(python3 -c "import json; print(json.load(open('task-status.json'))['task']['status'])")
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "Analysis complete."
              exit 0
            fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "SonarCloud analysis failed with status: $STATUS"
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for SonarCloud analysis"
          exit 1
      - name: Export SonarCloud issues as SARIF
        if: github.event_name == 'push'
        run: |
          curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
            "https://sonarcloud.io/api/issues/search?projectKeys=leo477_book-club-fe&resolved=false&ps=500" \
            -o sonar-issues.json
          node -e "
            const data = require('./sonar-issues.json');
            const sarif = {
              version: '2.1.0',
              '\$schema': 'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json',
              runs: [{
                tool: {
                  driver: {
                    name: 'SonarCloud',
                    informationUri: 'https://sonarcloud.io',
                    rules: []
                  }
                },
                results: (data.issues || []).map(issue => ({
                  ruleId: issue.rule,
                  message: { text: issue.message },
                  level: issue.severity === 'BLOCKER' || issue.severity === 'CRITICAL' ? 'error' :
                         issue.severity === 'MAJOR' ? 'warning' : 'note',
                  locations: [{
                    physicalLocation: {
                      artifactLocation: { uri: issue.component.split(':').pop() },
                      region: {
                        startLine: issue.textRange ? issue.textRange.startLine : 1,
                        endLine: issue.textRange ? issue.textRange.endLine : 1
                      }
                    }
                  }]
                }))
              }]
            };
            require('fs').writeFileSync('sonar.sarif', JSON.stringify(sarif, null, 2));
            console.log('SARIF generated with ' + sarif.runs[0].results.length + ' issues');
          "
      - name: Upload SARIF to GitHub Code Scanning
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: sonar.sarif
          category: sonarcloud

  changes:
    name: Detect legacy-relevant changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    outputs:
      legacy: ${{ steps.diff.outputs.legacy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      # apps/web-only pushes are deployed by web.yml; the Angular deploy is skipped for them.
      # Anything else (including packages/**) still deploys. Unknown base commit => deploy.
      - name: Diff against previous head
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "legacy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qvE '^(apps/web/|\.github/workflows/web\.yml$)'; then
            echo "legacy=true" >> "$GITHUB_OUTPUT"
          else
            echo "legacy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [lint, test, build, typecheck, changes]
    # Deploy gates only on the checks that must pass to ship (lint/test/build/typecheck).
    # SonarCloud and the npm audit scan are advisory — a dead token or a new upstream
    # advisory in security must never block a release on their own.
    if: github.event_name == 'push' && needs.changes.outputs.legacy == 'true'
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install Vercel CLI
        run: npm install --global vercel@55.0.0
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build project via Vercel
        run: vercel build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $DEPLOY_URL"
