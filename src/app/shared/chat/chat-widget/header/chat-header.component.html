@if (roomsView()) {
  <div class="chat-header chat-header--gradient flex items-center justify-between p-4">
    <div>
      <h2 class="text-white font-bold text-base">Book Club Chat</h2>
      <p class="text-white/70 text-xs">{{ roomCount() }} rooms</p>
    </div>
  </div>
} @else {
  <div
    class="chat-header flex items-center gap-3 p-3"
    [style.border-bottom]="'1px solid var(--border)'"
  >
    @if (showBackButton()) {
      <button
        class="back-btn flex-shrink-0"
        (click)="back.emit()"
        [attr.aria-label]="'CHAT.back' | translate"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
    }
    <div class="flex-1 min-w-0">
      <div class="font-semibold text-sm truncate" [style.color]="'var(--color-ink)'">{{ activeRoomName() }}</div>
    </div>
    <button
      class="flex-shrink-0 transition-colors"
      [style.color]="'var(--color-ink-muted)'"
      [attr.aria-label]="'CHAT.close' | translate"
      (click)="closePanel.emit()"
    >
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/>
      </svg>
    </button>
  </div>
}
